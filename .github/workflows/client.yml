name: Lint and tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python -m pip install ruff==0.14.3
      - run: python -m ruff check custom_components scripts tests
      - run: python scripts/check_distribution.py
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components scripts tests
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - homeassistant: "2026.8.0"
            pytest_plugin: "0.13.354"
          - homeassistant: "2026.10.4"
            pytest_plugin: "0.13.375"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python -m pip install -e . -r requirements_test.txt "homeassistant==${{ matrix.homeassistant }}" "pytest-homeassistant-custom-component==${{ matrix.pytest_plugin }}"
      - run: python -m coverage run --branch --source=custom_components/solem_woobee -m unittest discover -s tests -v
      - run: python -m pytest tests/integration -q --cov=custom_components.solem_woobee --cov-branch --cov-append --cov-report=term-missing --cov-report=json
      - run: python scripts/check_ha_coverage.py
      - run: python -m compileall -q custom_components scripts tests
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # verified in hass-sorgenia
