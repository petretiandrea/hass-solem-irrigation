name: Client
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components scripts tests
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        homeassistant: ["2026.8.0", "2026.10.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e . -r requirements_test.txt "homeassistant==${{ matrix.homeassistant }}"
      - run: python -m pytest tests/integration -q
