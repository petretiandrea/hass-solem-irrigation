name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # A draft has no Git tag until publication. Do not calculate another
      # version in the same invocation that creates that draft.
      - name: Create releases from merged release PRs
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Check for unpublished versioned releases
        id: drafts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          drafts=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | .tag_name')
          if [ -n "$drafts" ]; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"
            echo 'Release PR creation paused until versioned drafts are published or removed.'
          else
            echo 'pending=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare the next release PR
        if: steps.drafts.outputs.pending == 'false'
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
