  config-flow-test-coverage:
    status: done
    comment: Flow modules have 100% line/branch coverage in integration tests.
  dependency-transparency:
    status: todo
    comment: Embedded woobee_api is the agreed custom-integration architecture. A Core submission requires
      reviewing library packaging, license and public release provenance; no exemption claimed.
  docs-high-level-description:
    status: done
    comment: README.md describes WB-4 BLE scope, manual installation/configuration and removal.
  docs-installation-instructions:
    status: done
    comment: README.md describes WB-4 BLE scope, manual installation/configuration and removal.
  docs-removal-instructions:
    status: done
    comment: README.md describes WB-4 BLE scope, manual installation/configuration and removal.
  entity-event-setup:
    status: done
    comment: CoordinatorEntity owns subscription lifecycle; no synthetic listener. Lifecycle regression
      test covers add/remove and unload.
  entity-unique-id:
    status: done
    comment: Read platforms use normalized controller/zone IDs plus a field suffix. Actual registry IDs
      survive metadata changes and reload; tests/integration/test_entities.py.
  has-entity-name:
    status: done
    comment: All read entities inherit has_entity_name and use translated names with zone placeholders;
      actual HA names tested in English and Italian, including command buttons.
  test-before-setup:
    status: done
    comment: async_config_entry_first_refresh completes before registry and platform setup; failures retry
      setup.
  action-exceptions:
    status: done
    comment: Command validation, transport failures and unconfirmed outcomes raise HA errors; test_commands.py.
  parallel-updates:
    status: done
    comment: All platforms set PARALLEL_UPDATES=0; coordinator lock serializes commands and reads. test_commands.py.
  config-entry-unloading:
    status: done
    comment: Setup/unload/reload, timer shutdown and failed platform unload tested in tests/integration.
  docs-configuration-parameters:
    status: done
    comment: README.md documents BLE address selection, HA/Python prerequisites and Bluetooth reachability;
      no user credentials required.
  docs-installation-parameters:
    status: done
    comment: README.md documents BLE address selection, HA/Python prerequisites and Bluetooth reachability;
      no user credentials required.
  entity-unavailable:
    status: done
    comment: Real HA state tests cover unknown partial durations, reported zero, unavailable state on
      read failure and recovery. Connectivity remains available to report the last read outcome.
  integration-owner:
    status: done
    comment: manifest.json codeowners names petretiandrea.
  log-when-unavailable:
    status: done
    comment: Coordinator logs first failure and recovery without per-poll duplication; test_failure_and_recovery_logged_once
      verifies two consecutive failures and two successful reads.
  reauthentication-flow:
    status: exempt
    comment: 'No user account or renewable credential: fixed protocol key and fresh challenge on every
      BLE connection. Rejection is retried with a new session.'
  test-coverage:
    status: todo
    comment: HA wrapper modules including read platforms gated above 95% per module. Embedded client modules
      need complete coverage assessment; wrapper results alone do not meet the whole-integration rule.
  devices:
    status: done
    comment: All 23 registry entities share the normalized controller device; registry associations remain
      stable across metadata changes and reload.
  diagnostics:
    status: todo
    comment: Diagnostics redaction and a verified Bluetooth advertisement matcher are not implemented.
  discovery:
    status: todo
