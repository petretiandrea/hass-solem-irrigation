# Project checklist only: no official tier is claimed.
# Evidence and remaining work: docs/quality-scale.md
rules:
  action-setup:
    status: done
    comment: Entity action registered during async_setup with schema and services.yaml; test_commands.py verifies routing.
  docs-actions:
    status: done
    comment: docs/manual-irrigation.md documents duration action and global stop semantics, examples and errors.
  docs-conditions:
    status: exempt
    comment: No custom trigger or condition platforms are exposed. Manual command action documented separately.
  docs-triggers:
    status: exempt
    comment: No custom trigger or condition platforms are exposed. Manual command action documented separately.
  appropriate-polling:
    status: done
    comment: Five-minute conservative BLE interval; only real subscribers activate polling. See docs/coordinator.md;
      battery impact remains unmeasured.
  brands:
    status: todo
    comment: Verify or submit WooBee branding in the Home Assistant brands repository.
  common-modules:
    status: done
    comment: const.py, data.py and coordinator.py separate constants, entry runtime types and shared refresh
