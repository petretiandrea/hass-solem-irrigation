# Project checklist only: no official tier is claimed.
# Evidence and remaining work: docs/quality-scale.md
rules:
  action-setup:
    status: done
    comment: Entity action registered during async_setup with schema and services.yaml; test_commands.py verifies routing.
  docs-actions:
    status: done
    comment: docs/manual-irrigation.md documents valve actions, saved defaults, conditional close and global stop, examples and errors.
  docs-conditions:
    status: exempt
    comment: No custom trigger or condition platforms are exposed. Manual command action documented separately.
  docs-triggers:
    status: exempt
    comment: No custom trigger or condition platforms are exposed. Manual command action documented separately.
  appropriate-polling:
    status: done
    comment: Five-minute conservative BLE interval; only real subscribers activate polling. See docs/coordinator.md;
      battery impact remains unmeasured.
  brands:
    status: todo
    comment: Verify or submit WooBee branding in the Home Assistant brands repository.
  common-modules:
    status: done
    comment: const.py, data.py and coordinator.py separate constants, entry runtime types and shared refresh
      ownership.
  runtime-data:
    status: done
    comment: const.py, data.py and coordinator.py separate constants, entry runtime types and shared refresh
      ownership.
  config-flow:
    status: done
    comment: Bluetooth selection validates identity/state before creating an entry; normalized address
      prevents duplicates. tests/integration/test_config_flow.py.
  test-before-configure:
    status: done
    comment: Bluetooth selection validates identity/state before creating an entry; normalized address
      prevents duplicates. tests/integration/test_config_flow.py.
  unique-config-entry:
    status: done
    comment: Bluetooth selection validates identity/state before creating an entry; normalized address
      prevents duplicates. tests/integration/test_config_flow.py.
  config-flow-test-coverage:
    status: done
    comment: Flow modules have 100% line/branch coverage in integration tests.
  dependency-transparency:
    status: todo
    comment: Embedded woobee_api is the agreed custom-integration architecture. A Core submission requires
      reviewing library packaging, license and public release provenance; no exemption claimed.
  docs-high-level-description:
    status: done
    comment: README.md documents verified WB-4 scope, HACS/manual installation, configuration and removal; docs/releasing.md records pending clean-install acceptance.
  docs-installation-instructions:
    status: done
    comment: README.md describes WB-4 BLE scope, manual installation/configuration and removal.
  docs-removal-instructions:
    status: done
    comment: README.md describes WB-4 BLE scope, manual installation/configuration and removal.
  entity-event-setup:
    status: done
    comment: CoordinatorEntity owns subscription lifecycle; no synthetic listener. Lifecycle regression
      test covers add/remove and unload.
  entity-unique-id:
    status: done
    comment: Read platforms use normalized controller/zone IDs plus a field suffix. Actual registry IDs
      survive metadata changes and reload; tests/integration/test_entities.py.
  has-entity-name:
    status: done
    comment: All read entities inherit has_entity_name and use translated names with zone placeholders;
      actual HA names tested in English and Italian, including zone valves and global stop button.
  test-before-setup:
    status: done
    comment: async_config_entry_first_refresh completes before registry and platform setup; failures retry
      setup.
  action-exceptions:
    status: done
    comment: Command validation, transport failures and unconfirmed outcomes raise HA errors; test_commands.py. test_errors.py verifies original exception causes, messages, notes and nested chains.
  parallel-updates:
    status: done
    comment: All platforms set PARALLEL_UPDATES=0; coordinator lock serializes commands and reads. test_commands.py.
  config-entry-unloading:
    status: done
    comment: Setup/unload/reload, timer shutdown and failed platform unload tested in tests/integration.
  docs-configuration-parameters:
    status: done
    comment: README.md documents BLE address selection, HA/Python prerequisites and Bluetooth reachability;
      no user credentials required. Per-zone local duration defaults documented in docs/manual-irrigation.md.
  docs-installation-parameters:
    status: done
    comment: README.md documents BLE address selection, HA/Python prerequisites and Bluetooth reachability;
      no user credentials required. Per-zone local duration defaults documented in docs/manual-irrigation.md.
  entity-unavailable:
    status: done
    comment: Real HA state tests cover unknown partial durations, reported zero, unavailable state on
      read failure and recovery. Connectivity remains available to report the last read outcome.
  integration-owner:
    status: done
    comment: manifest.json codeowners names petretiandrea.
  log-when-unavailable:
    status: done
    comment: Coordinator logs first failure and recovery without per-poll duplication; test_failure_and_recovery_logged_once
      verifies two consecutive failures and two successful reads. test_errors.py checks availability messages at DEBUG, original causal chains and fresh-session recovery.
  reauthentication-flow:
    status: exempt
    comment: 'No user account or renewable credential: fixed protocol key and fresh challenge on every
      BLE connection. Rejection is retried with a new session.'
  test-coverage:
    status: todo
    comment: HA wrapper modules including valve and read platforms gated above 95% per module. Embedded client modules
      need complete coverage assessment; wrapper results alone do not meet the whole-integration rule.
  devices:
    status: done
    comment: All 23 registry entities share the normalized controller device; registry associations remain
      stable across metadata changes and reload.
  diagnostics:
    status: done
    comment: diagnostics.py exports only allowlisted cached operational fields; no identity, config, raw frames or session secrets. test_diagnostics.py verifies empty, stale and partial data without I/O.
  discovery:
    status: todo
    comment: SBR-101 remains blocked on supervised WB-4/type-180 firmware-7.0.2 advertisement bytes and provenance; GATT evidence does not establish a matcher. See docs/bluetooth-discovery.md.
  discovery-update-info:
    status: todo
    comment: SBR-101 remains TODO pending verified advertisements and a stable advertised identity; address/name matching cannot safely identify an address change. Frozen legacy registry identities are documented in docs/bluetooth-discovery.md.
  docs-data-update:
    status: done
    comment: README.md and docs/coordinator.md describe WB-4 firmware scope, read snapshots, missing values,
      polling and hardware-validation limits.
  docs-known-limitations:
    status: done
    comment: README.md and docs/coordinator.md describe WB-4 firmware scope, read snapshots, missing values,
      polling and hardware-validation limits.
  docs-supported-devices:
    status: done
    comment: README.md and docs/coordinator.md describe WB-4 firmware scope, read snapshots, missing values,
      polling and hardware-validation limits.
  docs-supported-functions:
    status: done
    comment: README.md and docs/coordinator.md describe WB-4 firmware scope, read snapshots, missing values,
      polling and hardware-validation limits.
  docs-examples:
    status: done
    comment: README provides dashboard entity-picker and valve-fault automation examples without assuming
      entity IDs.
  docs-troubleshooting:
    status: done
    comment: README covers failed reads, BLE range/connection slots, next poll/reload, optional unknown
      pages and enabling diagnostic entities. docs/diagnostics-and-validation.md documents anonymous downloads and supervised hardware checks.
  docs-use-cases:
    status: done
    comment: README explains irrigation monitoring and per-zone valve-fault notifications, with reported-state
      versus water-flow limitations.
  dynamic-devices:
    status: exempt
    comment: One fixed four-zone WB-4 per config entry; no dynamically added child hardware.
  entity-category:
    status: done
    comment: Connectivity, clock/input flags, valve faults and raw battery are diagnostic. Operational
      status remains uncategorized; zone valves and global stop are operational; duration defaults are local HA options.
  entity-device-class:
    status: done
    comment: Water valves, duration in seconds, running activity, problem flags and read connectivity tested. Unscaled
      battery has no fabricated class, unit or statistics.
  entity-disabled-by-default:
    status: done
    comment: Unscaled raw battery is diagnostic and disabled by default; tests verify registry default
      and explicit enable/reload. Other exposed fields are operationally useful.
  entity-translations:
    status: done
    comment: strings.json and en/it translations cover read entities and zone valves and global stop button and zone placeholders; actual
      HA names verified in both languages.
  icon-translations:
    status: done
    comment: icons.json supplies icons by translation key for enabled/manual/input flags and raw battery.
      Duration, running, problem and connectivity retain HA device-class icons; no Python icon overrides.
  exception-translations:
    status: done
    comment: Coordinator and duration validation use exceptions keys in strings/en/it with safe limit placeholders; test_errors.py checks HA translations and original causes.
  reconfiguration-flow:
    status: done
    comment: SBR-101 adds async_step_reconfigure with authenticated snapshot/known-serial validation, confirmation, collision recheck and update/reload. test_reconfigure.py covers errors/retry/cancel, serial absence/mismatch, repeated address changes preserving all 23 entity records/device/options and unload. Missing original serial fails closed; see docs/bluetooth-discovery.md.
  repair-issues:
    status: exempt
    comment: No supported user credential, firmware requirement or configuration migration to repair. BLE/session failures recover on fresh reads; valve faults have no verified software remedy and battery scale is unknown. See SBR-102 review in docs/quality-scale.md.
  stale-devices:
    status: exempt
    comment: One fixed WB-4 device per entry; zones are entities, not removable child devices. Official single-device exemption applies. test_fixed_controller_entry_removal verifies online/offline entry removal cleans registry and polling.
  async-dependency:
    status: done
    comment: Embedded client uses asynchronous BLE transport, bounded operations and session cleanup;
      client unit tests cover ownership and cancellation.
  inject-websession:
    status: exempt
    comment: Local BLE integration; no HTTP client or web session.
  strict-typing:
    status: todo
    comment: Complete strict type checking for wrapper and embedded client; no strict typing gate currently
      runs.
