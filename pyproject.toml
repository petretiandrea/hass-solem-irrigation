[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "solem-woobee"
dynamic = ["version"]
description = "Embedded asynchronous BLE client for SOLEM WooBee controllers"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["bleak>=0.22", "cryptography>=42"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"


[tool.hatch.build.targets.wheel]
packages = ["custom_components/solem_woobee/woobee_api"]

[tool.hatch.version]
path = "custom_components/solem_woobee/manifest.json"
pattern = '"version": "(?P<version>[^\"]+)"'

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Fatal syntax/control-flow errors and undefined names; formatting is not gated.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/solem_woobee"]
explicit_package_bases = true
